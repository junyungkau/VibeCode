<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>클릭 공손 번역기 — 교수님께 보내는 메일</title>
<meta name="description" content="하고 싶은 말을 막 적으면, 교수님께 보내도 되는 메일로 클릭 한 번에 바꿔드립니다. 원클릭 유니온 데모.">
<meta name="theme-color" content="#0E1B3D">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232F54FF'/%3E%3Cpath d='M22 14 L22 46 L30 39 L35.5 51 L41 48.5 L35.5 37 L46.5 37 Z' fill='%23fff' stroke='%23fff' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  :root{
    --navy:#0E1B3D; --blue:#2F54FF; --blue-2:#8FA2FF; --blue-soft:#EEF2FF;
    --bg:#F4F6FA; --ink:#0E1B3D; --muted:#5B6478; --line:#DDE2EC;
    --body:'Pretendard',sans-serif; --mono:'JetBrains Mono',monospace;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:var(--bg); color:var(--ink); font-family:var(--body); line-height:1.5; -webkit-font-smoothing:antialiased; word-break:keep-all; min-height:100vh; }
  .col{ max-width:600px; margin:0 auto; padding:0 20px; }
  :focus-visible{ outline:3px solid var(--blue-2); outline-offset:3px; }

  .top{ position:relative; overflow:hidden; color:#fff; padding:18px 0 76px;
    background:radial-gradient(circle at 85% 0%, rgba(47,84,255,.55), rgba(47,84,255,0) 60%), var(--navy); }
  .top::before{ content:""; position:absolute; inset:0; pointer-events:none;
    background-image:linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
    background-size:40px 40px; -webkit-mask-image:linear-gradient(180deg,#000,transparent); mask-image:linear-gradient(180deg,#000,transparent); }
  .top .col{ position:relative; }
  .nav{ display:flex; justify-content:space-between; align-items:center; }
  .back{ display:inline-flex; align-items:center; gap:9px; color:#fff; text-decoration:none; font-size:14px; font-weight:800; letter-spacing:.02em; }
  .mark{ width:28px; height:28px; border-radius:8px; background:var(--blue); display:grid; place-items:center; }
  .no{ font-family:var(--mono); font-size:12px; font-weight:700; letter-spacing:.12em; color:var(--blue-2); }
  .kicker{ margin-top:34px; font-size:17px; font-weight:800; color:var(--blue-2); letter-spacing:-.02em; }
  h1{ margin-top:4px; font-size:clamp(38px,11vw,52px); font-weight:900; letter-spacing:-.055em; line-height:1.08; }
  .sub{ margin-top:12px; color:#C3CBE3; font-size:15.5px; line-height:1.6; }

  .card{ background:#fff; border:1px solid var(--line); border-radius:20px; box-shadow:0 20px 44px -28px rgba(14,27,61,.45); }
  .form{ position:relative; margin-top:-48px; padding:20px; }
  .lbl{ display:flex; justify-content:space-between; align-items:baseline; font-size:14.5px; font-weight:800; margin-bottom:8px; }
  .lbl small{ font-size:12px; font-weight:600; color:var(--muted); }
  textarea{ width:100%; min-height:120px; resize:vertical; font:inherit; font-size:16px; line-height:1.6; color:var(--ink);
    background:#FAFBFD; border:1.5px solid var(--line); border-radius:14px; padding:14px 15px; }
  textarea:focus{ outline:none; border-color:var(--blue); background:#fff; box-shadow:0 0 0 4px rgba(47,84,255,.12); }
  .examples{ display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:10px; font-size:12.5px; font-weight:700; color:var(--muted); }
  .ex{ font:inherit; font-size:13px; font-weight:700; color:var(--blue); background:var(--blue-soft); border:0; border-radius:999px; padding:6px 12px; cursor:pointer; }
  .ex:hover{ background:#DFE6FF; }
  .field + .field{ margin-top:20px; }
  .seg{ display:flex; flex-wrap:wrap; gap:8px; }
  .seg input{ position:absolute; opacity:0; pointer-events:none; }
  .seg label{ cursor:pointer; font-size:14px; font-weight:700; padding:9px 14px; border-radius:12px; border:1.5px solid var(--line); background:#fff; transition:background .12s, border-color .12s; }
  .seg label:hover{ border-color:var(--navy); }
  .seg input:checked + label{ background:var(--navy); border-color:var(--navy); color:#fff; }
  .seg input:focus-visible + label{ outline:3px solid var(--blue-2); outline-offset:2px; }
  .btn{ margin-top:22px; width:100%; display:flex; align-items:center; justify-content:center; gap:10px;
    font:inherit; font-size:17px; font-weight:800; color:#fff; background:var(--blue); border:0; border-radius:14px; padding:17px; cursor:pointer;
    box-shadow:0 12px 30px -12px rgba(47,84,255,.8); transition:background .12s, transform .12s; }
  .btn:hover{ background:#2647E6; }
  .btn:active{ transform:scale(.98); }
  .btn:disabled{ opacity:.75; cursor:progress; }
  .spinner{ width:18px; height:18px; border-radius:50%; border:2.5px solid rgba(255,255,255,.35); border-top-color:#fff; animation:rot .8s linear infinite; }
  @keyframes rot{ to{ transform:rotate(360deg); } }

  #result{ margin-top:16px; }
  .result{ padding:20px; animation:pop .35s ease; }
  @keyframes pop{ from{ opacity:0; transform:translateY(8px); } }
  .rhead{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .rtag{ display:inline-flex; align-items:center; gap:7px; font-family:var(--mono); font-size:11.5px; font-weight:700; letter-spacing:.12em; color:var(--blue); }
  .rtag i{ width:8px; height:8px; border-radius:50%; background:#34D399; }
  .copy{ font:inherit; font-size:13px; font-weight:800; color:var(--ink); background:#fff; border:1.5px solid var(--line); border-radius:10px; padding:7px 12px; cursor:pointer; }
  .copy:hover{ border-color:var(--navy); }
  .error{ background:#fff; border:1.5px solid #F3C4C4; color:#9B1C1C; border-radius:14px; padding:14px 16px; font-size:14.5px; font-weight:600; }
  .error small{ display:block; margin-top:4px; color:#B45353; font-weight:500; }
  .wait{ text-align:center; padding:22px 16px; color:var(--muted); font-size:14.5px; font-weight:600; }
  .wait b{ color:var(--ink); }

  .mail{ border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .mrow{ display:grid; grid-template-columns:72px 1fr; gap:8px; padding:11px 14px; font-size:14.5px; border-bottom:1px solid var(--line); background:#FAFBFD; }
  .mrow span{ font-size:12.5px; font-weight:800; color:var(--muted); padding-top:1px; }
  .mrow b{ font-weight:800; }
  .mbody{ padding:16px 14px 18px; font-size:15px; line-height:1.75; white-space:pre-wrap; }
  .tip{ margin-top:10px; font-size:13px; color:var(--muted); font-weight:500; }

  .promo{ display:flex; align-items:center; gap:14px; margin-top:28px; text-decoration:none; color:#fff; background:var(--navy); border-radius:18px; padding:18px 20px; }
  .promo .t{ font-weight:800; font-size:15.5px; letter-spacing:-.02em; }
  .promo .s{ font-size:13px; color:#C3CBE3; margin-top:2px; }
  .promo .go{ margin-left:auto; font-weight:800; font-size:14px; color:var(--blue-2); white-space:nowrap; }
  footer{ padding:22px 0 36px; text-align:center; font-size:12px; color:var(--muted); }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="col">
    <div class="nav">
      <a class="back" href="https://oneclick-link.vercel.app/">
        <span class="mark"><svg width="14" height="17" viewBox="0 0 22 26" aria-hidden="true"><path d="M2 1 L2 21 L7 16.5 L10.5 24 L14 22.5 L10.5 15 L17.5 15 Z" fill="#fff" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg></span>
        원클릭 유니온
      </a>
      <span class="no">DEMO 01</span>
    </div>
    <p class="kicker">하고 싶은 말을 교수님 메일로</p>
    <h1>클릭 공손 번역기</h1>
    <p class="sub">막 적어도 괜찮아요. 클릭 한 번이면 교수님께 보내도 되는 메일이 돼요.</p>
  </div>
</header>

<main class="col">
  <section class="card form">
    <div class="field">
      <div class="lbl"><label for="raw">하고 싶은 말</label><small>솔직하게, 반말도 OK</small></div>
      <textarea id="raw" maxlength="500" placeholder="예: 저번주 과제 늦게 낸거 점수 좀 봐주시면 안되나요 진짜 아파서 못했어요"></textarea>
      <div class="examples">예시
        <button class="ex" type="button" data-raw="교수님 저 이번 과제 하루만 늦게 내도 돼요? 알바가 갑자기 잡혀서 못했어요" data-sit="과제 기한 연장/지각 제출 부탁">과제 하루 연장</button>
        <button class="ex" type="button" data-raw="중간고사 점수가 생각보다 너무 낮게 나왔는데 혹시 채점 한번만 다시 확인해주실 수 있나요" data-sit="성적 문의">성적 확인</button>
        <button class="ex" type="button" data-raw="내일 예비군 때문에 수업 못 가요 출석 인정되나요" data-sit="수업 결석 사유 전달">예비군 결석</button>
      </div>
    </div>
    <div class="field">
      <div class="lbl"><span id="sit-label">상황</span></div>
      <div class="seg" role="radiogroup" aria-labelledby="sit-label">
        <input type="radio" name="sit" id="s1" value="과제 기한 연장/지각 제출 부탁" checked><label for="s1">과제 연장·지각</label>
        <input type="radio" name="sit" id="s2" value="성적 문의"><label for="s2">성적 문의</label>
        <input type="radio" name="sit" id="s3" value="수업 결석 사유 전달"><label for="s3">결석 사유</label>
        <input type="radio" name="sit" id="s4" value="추천서/면담 요청"><label for="s4">추천서·면담</label>
        <input type="radio" name="sit" id="s5" value="기타 (내용으로 판단)"><label for="s5">기타</label>
      </div>
    </div>
    <button class="btn" id="go" type="button">공손하게 바꾸기</button>
  </section>

  <div id="result" aria-live="polite"></div>

  <a class="promo" href="https://oneclick-link.vercel.app/">
    <div><div class="t">이 데모, 원클릭 유니온 2주차면 직접 만들어요</div><div class="s">코딩 몰라도 지원 가능 · 회비 0원</div></div>
    <span class="go">지원하기 →</span>
  </a>
  <footer>Powered by NVIDIA NIM (free API) · 프롬프트만 바꾸면 뭐든 됩니다</footer>
</main>

<script>
const go = document.getElementById('go');
const rawEl = document.getElementById('raw');
const resultEl = document.getElementById('result');
const LABEL = '공손하게 바꾸기';

document.querySelectorAll('.ex').forEach(b => b.addEventListener('click', () => {
  rawEl.value = b.dataset.raw;
  const r = document.querySelector('input[name="sit"][value="' + b.dataset.sit + '"]');
  if (r) r.checked = true;
  rawEl.focus();
}));

go.addEventListener('click', async () => {
  const raw = rawEl.value.trim();
  const situation = document.querySelector('input[name="sit"]:checked').value;
  if (!raw) { resultEl.innerHTML = '<div class="error">먼저 하고 싶은 말을 적어주세요!</div>'; rawEl.focus(); return; }

  go.disabled = true;
  go.innerHTML = '<span class="spinner"></span>메일로 바꾸는 중';
  let sec = 0;
  resultEl.innerHTML = '<div class="card wait">문장을 공손하게 다림질하는 중… <b id="sec">0초</b></div>';
  const timer = setInterval(() => { const s = document.getElementById('sec'); if (s) s.textContent = (++sec) + '초'; }, 1000);

  try {
    const res = await fetch('/api/polish', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ raw, situation })
    });
    if (!res.ok) throw new Error('서버 응답 오류 (' + res.status + ')');
    const data = await res.json();

    resultEl.innerHTML = `
      <div class="card result">
        <div class="rhead"><span class="rtag"><i></i>MAIL READY</span><button class="copy" id="copyBtn" type="button">전체 복사</button></div>
        <div class="mail">
          <div class="mrow"><span>받는 사람</span><div>교수님</div></div>
          <div class="mrow"><span>제목</span><b>${esc(data.subject)}</b></div>
          <div class="mbody">${esc(data.body)}</div>
        </div>
        <p class="tip">[학과], [이름] 자리는 내 정보로 바꿔서 보내세요.</p>
      </div>`;
    document.getElementById('copyBtn').addEventListener('click', e => {
      copyText('제목: ' + data.subject + '\n\n' + data.body);
      e.target.textContent = '복사 완료!';
    });
  } catch (err) {
    resultEl.innerHTML = '<div class="error">변환에 실패했어요. 잠시 후 다시 시도해주세요.<small>' + esc(err.message) + '</small></div>';
  } finally {
    clearInterval(timer);
    go.disabled = false; go.textContent = LABEL;
  }
});

function copyText(t) {
  if (navigator.clipboard) return navigator.clipboard.writeText(t);
  const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove();
}
function esc(s) { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }
</script>
</body>
</html>
